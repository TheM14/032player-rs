[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
api = { path = "crates/api" }
session = { path = "crates/session" }
lyrics = { path = "crates/lyrics" }
client-core = { path = "crates/core" }
player = { path = "crates/player" }
os = { path = "crates/os" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["default-tls", "http2", "json", "system-proxy"] }
# Same proxy matcher reqwest uses; the app hands its result to mpv.
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
http = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lru = "0.16"
# Japanese segmentation for furigana / romaji (IPADIC embedded, about 48 MB).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
bytes = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
slint = "1.18"
slint-build = "1.18"
directories = "6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6"
keyring = "4.2"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
tray-icon = { version = "0.26", default-features = false }
raw-window-handle = "0.6"
# Native file dialogs; the portal backend keeps Linux free of GTK.
# Opens 032 web console pages in the default browser.
open = "5"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

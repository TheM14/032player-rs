name: Package

# Portable Windows build for testing (formal releases: release.yml).
# Run from the Actions tab ("Run workflow"); the zip is attached directly to
# the "preview" pre-release without duplicating it as an Actions artifact.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Static CRT: runs without the VC++ redistributable.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exclude build paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP" -ErrorAction SilentlyContinue
          } catch {}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Ensure lld-link is available
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "C:\Program Files\LLVM\bin",
              (Join-Path (rustc --print sysroot) "lib\rustlib\x86_64-pc-windows-msvc\bin\gcc-ld")
            )
            foreach ($dir in $candidates) {
              if (Test-Path (Join-Path $dir "lld-link.exe")) {
                $dir >> $env:GITHUB_PATH
                $env:PATH = "$dir;$env:PATH"
                break
              }
            }
          }
          lld-link --version
      - name: Rust environment fingerprint
        id: rust-env
        shell: pwsh
        run: |
          $checksums = (Select-String -Path Cargo.lock -Pattern '^checksum = ' | ForEach-Object { $_.Line }) -join "`n"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $lockHex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($checksums))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          $parts = @(
            (rustc --version --verbose | Out-String),
            "RUSTFLAGS=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS",
            "LINKER=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER",
            $checksums,
            ((Get-Content Cargo.toml | Select-String -Pattern '^(opt-level|debug|codegen-units|strip|\[profile\.)' | ForEach-Object { $_.Line }) -join "`n")
          ) -join "`n---`n"
          $hex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($parts))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          "hash=$hex" >> $env:GITHUB_OUTPUT
          "lock_hash=$lockHex" >> $env:GITHUB_OUTPUT
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache sparse crates.io index
        id: index-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry/index
          key: crates-index-win-v1-${{ steps.rust-env.outputs.lock_hash }}
      - name: Cache compiled Slint UI (app-ui release)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/release/build/app-ui
            target/x86_64-pc-windows-msvc/release/build/app-ui
          key: app-ui-win-release-v1-${{ steps.rust-env.outputs.hash }}-${{ hashFiles('crates/app-ui/**', 'crates/app/ui/**', 'crates/app/assets/icon.png') }}
      - name: Normalize app-ui input mtimes
        shell: pwsh
        run: |
          $t = [DateTime]::SpecifyKind([DateTime]'2020-01-01T00:00:00', [DateTimeKind]::Utc)
          Get-ChildItem -File -Recurse crates/app-ui, crates/app/ui | ForEach-Object { $_.LastWriteTimeUtc = $t }
          (Get-Item crates/app/assets/icon.png).LastWriteTimeUtc = $t
      - name: Cache libmpv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/libmpv
          key: libmpv-${{ hashFiles('crates/player/build.rs') }}

      - name: Build
        shell: pwsh
        run: |
          $flags = @("--locked")
          if (("${{ steps.rust-cache.outputs.cache-hit }}" -eq "true") -and (Test-Path "$env:CARGO_HOME\registry\index\index.crates.io-*\.cache\re\qw\reqwest")) { $flags += "--offline" }
          cargo build @flags -p app --release --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $name = "032player-windows-x64-$sha"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $out = "target/x86_64-pc-windows-msvc/release"
          if (-not (Test-Path "$out/libmpv-2.dll")) {
            $dll = Get-ChildItem -Path target/libmpv -Filter libmpv-2.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) { throw "libmpv-2.dll not found in $out or target/libmpv" }
            Copy-Item $dll.FullName "$out/libmpv-2.dll"
          }
          Copy-Item "$out/032player.exe" $dir
          Copy-Item "$out/libmpv-2.dll" $dir
          Copy-Item LICENSE "$dir/LICENSE.txt"
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item "crates/app/assets/fonts/OFL-NotoSansSC.txt" "$dir/licenses/"
          Copy-Item "crates/app/assets/fonts/OFL-SourceSerif4.txt" "$dir/licenses/"
          Copy-Item "crates/app/assets/fonts/README.md" "$dir/licenses/FONTS.md"
          @"
          032player $sha (preview)

          Run 032player.exe. Log: %APPDATA%\032player\data\logs\032player.log (settings page: 打开日志文件夹); attach it to bug reports.
          Optional: set M032_SERVER_URL, M032_API_TOKEN and M032_MEDIA_TOKEN to sign in automatically.
          "@ | Set-Content "$dir/README.txt" -Encoding utf8
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          "ZIP=dist/$name.zip" >> $env:GITHUB_ENV
          "NAME=$name" >> $env:GITHUB_ENV

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete preview --yes --cleanup-tag 2>$null
          gh release create preview "$env:ZIP" --prerelease --target "${{ github.sha }}" `
            --title "Preview ${{ github.sha }}" `
            --notes "Portable Windows build of ${{ github.sha }} for testing. Unzip and run 032player.exe."

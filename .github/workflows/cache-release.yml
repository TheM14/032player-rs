name: Warm Windows Release Cache

# Pre-warms `main`-scoped caches (`windows-release` deps + compiled `app-ui`)
# so tag-triggered `release.yml` and manual `package.yml` builds hit warm
# release caches instead of cold-compiling 380+ crates from scratch.

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/*/Cargo.toml
      - crates/app-ui/**
      - crates/app/ui/**
      - crates/app/assets/icon.png
      - rust-toolchain.toml
      - .github/workflows/cache-release.yml
  schedule:
    # Touch caches weekly so GitHub Actions does not evict unused caches after 7 days.
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Run cargo build --release even when all caches hit (for timing benchmarks)"
        required: false
        type: boolean
        default: false

concurrency:
  group: cache-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exclude build paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP" -ErrorAction SilentlyContinue
          } catch {}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Ensure lld-link is available
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "C:\Program Files\LLVM\bin",
              (Join-Path (rustc --print sysroot) "lib\rustlib\x86_64-pc-windows-msvc\bin\gcc-ld")
            )
            foreach ($dir in $candidates) {
              if (Test-Path (Join-Path $dir "lld-link.exe")) {
                $dir >> $env:GITHUB_PATH
                $env:PATH = "$dir;$env:PATH"
                break
              }
            }
          }
          lld-link --version
      - name: Rust environment fingerprint
        id: rust-env
        shell: pwsh
        run: |
          $checksums = (Select-String -Path Cargo.lock -Pattern '^checksum = ' | ForEach-Object { $_.Line }) -join "`n"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $lockHex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($checksums))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          $parts = @(
            (rustc --version --verbose | Out-String),
            "RUSTFLAGS=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS",
            "LINKER=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER",
            $checksums,
            ((Get-Content Cargo.toml | Select-String -Pattern '^(opt-level|debug|codegen-units|strip|\[profile\.)' | ForEach-Object { $_.Line }) -join "`n")
          ) -join "`n---`n"
          $hex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($parts))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          "hash=$hex" >> $env:GITHUB_OUTPUT
          "lock_hash=$lockHex" >> $env:GITHUB_OUTPUT
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Restore sparse crates.io index
        id: index-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry/index
          key: crates-index-win-v1-${{ steps.rust-env.outputs.lock_hash }}
      - name: Cache compiled Slint UI (app-ui release)
        id: app-ui-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/release/build/app-ui
            target/x86_64-pc-windows-msvc/release/build/app-ui
          key: app-ui-win-release-v1-${{ steps.rust-env.outputs.hash }}-${{ hashFiles('crates/app-ui/**', 'crates/app/ui/**', 'crates/app/assets/icon.png') }}
      - name: Normalize app-ui input mtimes
        shell: pwsh
        run: |
          $t = [DateTime]::SpecifyKind([DateTime]'2020-01-01T00:00:00', [DateTimeKind]::Utc)
          Get-ChildItem -File -Recurse crates/app-ui, crates/app/ui | ForEach-Object { $_.LastWriteTimeUtc = $t }
          Get-Item crates/app/assets/icon.png, Cargo.toml | ForEach-Object { $_.LastWriteTimeUtc = $t }
      - name: Cache libmpv
        id: libmpv-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/libmpv
          key: libmpv-${{ hashFiles('crates/player/build.rs') }}
      - name: Build release caches
        if: >-
          inputs.force_build == true ||
          steps.rust-cache.outputs.cache-hit != 'true' ||
          steps.app-ui-cache.outputs.cache-hit != 'true' ||
          steps.libmpv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $flags = @("--locked")
          if (("${{ steps.rust-cache.outputs.cache-hit }}" -eq "true") -and ("${{ steps.index-cache.outputs.cache-hit }}" -eq "true") -and (Test-Path "$env:CARGO_HOME\registry\index\index.crates.io-*\.cache\re\qw\reqwest")) { $flags += "--offline" }
          cargo build @flags -p app --release --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "target/x86_64-pc-windows-msvc/release/032player.exe" | Select-Object Name, Length

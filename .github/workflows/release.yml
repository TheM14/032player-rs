name: Release

# Formal release: push a tag `vX.Y.Z` matching the workspace version.
# Runs Linux checks and the Windows release build in parallel, then publishes
# the Windows installer (Inno Setup) and portable zip as a GitHub release.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - name: System libraries
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name '*ubuntu*' -delete
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=20 libmpv-dev libfontconfig1-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          workspaces: |
            .
            tools/ui-snapshot
          # Tag-scoped caches cannot be read by subsequent tags; reuse main's warm cache.
          save-if: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI snapshot regression
        run: cargo run --manifest-path tools/ui-snapshot/Cargo.toml -- /tmp/ui-snapshot

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Static CRT: runs without the VC++ redistributable.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $line = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ($tag -ne $version) { throw "tag $tag does not match the workspace version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Exclude build paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP" -ErrorAction SilentlyContinue
          } catch {}

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          # Tag-scoped caches cannot be read by subsequent tags; reuse main's warm cache.
          save-if: false
      - name: Cache libmpv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/libmpv
          key: libmpv-${{ hashFiles('crates/player/build.rs') }}

      - name: Test
        run: cargo test --workspace --target x86_64-pc-windows-msvc

      - name: Build
        run: cargo build -p app --release --target x86_64-pc-windows-msvc

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 -y --no-progress
          }

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $out = (Resolve-Path "target/x86_64-pc-windows-msvc/release").Path
          if (-not (Test-Path "$out/libmpv-2.dll")) {
            $dll = Get-ChildItem -Path target/libmpv -Filter libmpv-2.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) { throw "libmpv-2.dll not found in $out or target/libmpv" }
            Copy-Item $dll.FullName "$out/libmpv-2.dll"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $dist = (Resolve-Path dist).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceDir=$out" "/DOutputDir=$dist" packaging/windows/032player.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          $name = "032player-$env:VERSION-windows-x64-portable"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$out/032player.exe" $dir
          Copy-Item "$out/libmpv-2.dll" $dir
          Copy-Item LICENSE "$dir/LICENSE.txt"
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item "crates/app/assets/fonts/OFL-NotoSansSC.txt" "$dir/licenses/"
          Copy-Item "crates/app/assets/fonts/OFL-SourceSerif4.txt" "$dir/licenses/"
          Copy-Item "crates/app/assets/fonts/README.md" "$dir/licenses/FONTS.md"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force $dir
          Get-ChildItem dist -File | ForEach-Object { "$($_.Name) $($_.Length)" }

      # Temporary handoff to `publish` so `test` and `windows` run in parallel.
      # `publish` deletes this artifact immediately so permanent Actions storage stays 0.
      - name: Stage release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [test, windows]
    if: always() && needs.windows.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download release assets
        if: needs.test.result == 'success' && needs.windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Publish release
        if: needs.test.result == 'success' && needs.windows.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          notes=$(cat <<EOF
          032player ${VERSION}

          - 032player-${VERSION}-windows-x64-setup.exe: 安装包（当前用户安装，不需要管理员权限）
          - 032player-${VERSION}-windows-x64-portable.zip: 免安装版，解压后运行 032player.exe

          设置保存在 %APPDATA%\032player\data（登录凭据在 Windows 凭据管理器），卸载时保留；日志在其中的 logs 文件夹（设置页"打开日志文件夹"）。
          EOF
          )
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "032player ${VERSION}" --notes "${notes}" --verify-tag

      - name: Delete temporary artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ needs.windows.outputs.artifact_id }}" || true

      - name: Verify upstream jobs
        if: needs.test.result != 'success' || needs.windows.result != 'success'
        run: |
          echo "Upstream job did not succeed (test=${{ needs.test.result }}, windows=${{ needs.windows.result }})"
          exit 1

name: Release

# Formal release: push a tag `vX.Y.Z` matching the workspace version.
# Runs Linux checks, Windows unit/integration tests, and the Windows release
# build in parallel, then publishes the Windows installer (Inno Setup) and
# portable zip as a GitHub release.

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - name: Runner image version
        id: image
        run: echo "version=${ImageVersion:-ubuntu-24.04}" >> "$GITHUB_OUTPUT"
      - name: Restore system libraries cache
        id: apt-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/apt-debs
          key: apt-ubuntu-24.04-${{ steps.image.outputs.version }}-libmpv-fontconfig-v1
      - name: System libraries
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && compgen -G "/tmp/apt-debs/*.deb" >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l dpkg --force-unsafe-io -i /tmp/apt-debs/*.deb || {
              sudo find /etc/apt/sources.list.d -type f ! -name '*ubuntu*' -delete
              sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
              sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -f --no-install-recommends \
                -o DPkg::Options::="--force-unsafe-io" \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            }
          else
            mkdir -p /tmp/apt-debs
            sudo find /etc/apt/sources.list.d -type f ! -name '*ubuntu*' -delete
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends \
              -o Dir::Cache::archives=/tmp/apt-debs \
              -o APT::Keep-Downloaded-Packages=true \
              -o DPkg::Options::="--force-unsafe-io" \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              libmpv-dev libfontconfig1-dev pkg-config
            sudo rm -rf /tmp/apt-debs/partial /tmp/apt-debs/lock
            sudo chown -R "$(id -u):$(id -g)" /tmp/apt-debs
          fi
      - name: Rust environment fingerprint
        id: rust-env
        run: |
          {
            rustc --version --verbose
            printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS:-}"
            grep '^checksum = ' Cargo.lock || true
            grep -E '^(opt-level|debug|codegen-units|strip|\[profile\.)' Cargo.toml || true
          } | sha256sum | awk '{print "hash=" substr($1, 1, 16)}' >> "$GITHUB_OUTPUT"
          {
            grep '^checksum = ' Cargo.lock || true
            grep '^checksum = ' tools/ui-snapshot/Cargo.lock || true
          } | sha256sum | awk '{print "lock_hash=" substr($1, 1, 16)}' >> "$GITHUB_OUTPUT"
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          workspaces: |
            .
            tools/ui-snapshot
          # Tag-scoped caches cannot be read by subsequent tags; reuse main's warm cache.
          save-if: false
      - name: Restore sparse crates.io index
        id: index-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry/index
          key: crates-index-linux-v1-${{ steps.rust-env.outputs.lock_hash }}
      - name: Restore compiled Slint UI (app-ui)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/debug/build/app-ui
          key: app-ui-linux-debug-v3-${{ steps.rust-env.outputs.hash }}-${{ hashFiles('crates/app-ui/**', 'crates/app/ui/**', 'crates/app/assets/icon.png') }}
      - name: Normalize app-ui input mtimes
        run: |
          find crates/app-ui crates/app/ui -type f -exec touch -d '2020-01-01T00:00:00Z' {} +
          touch -d '2020-01-01T00:00:00Z' crates/app/assets/icon.png Cargo.toml
      - run: cargo fmt --all --check
      - name: Clippy
        run: |
          OFFLINE=""
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ] && [ "${{ steps.index-cache.outputs.cache-hit }}" = "true" ] && compgen -G "${CARGO_HOME:-$HOME/.cargo}/registry/index/index.crates.io-*/.cache/re/qw/reqwest" >/dev/null; then OFFLINE="--offline"; fi
          cargo clippy --locked $OFFLINE --workspace --exclude app-ui --all-targets -- -D warnings
      - name: Test
        run: |
          OFFLINE=""
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ] && [ "${{ steps.index-cache.outputs.cache-hit }}" = "true" ] && compgen -G "${CARGO_HOME:-$HOME/.cargo}/registry/index/index.crates.io-*/.cache/re/qw/reqwest" >/dev/null; then OFFLINE="--offline"; fi
          cargo test --locked $OFFLINE --workspace --exclude app-ui --lib --tests --bins
      - name: UI snapshot regression
        run: |
          OFFLINE=""
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ] && [ "${{ steps.index-cache.outputs.cache-hit }}" = "true" ] && compgen -G "${CARGO_HOME:-$HOME/.cargo}/registry/index/index.crates.io-*/.cache/re/qw/reqwest" >/dev/null; then OFFLINE="--offline"; fi
          cargo run --locked $OFFLINE --manifest-path tools/ui-snapshot/Cargo.toml -- /tmp/ui-snapshot

  windows-test:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exclude build paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP" -ErrorAction SilentlyContinue
          } catch {}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Ensure lld-link is available
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "C:\Program Files\LLVM\bin",
              (Join-Path (rustc --print sysroot) "lib\rustlib\x86_64-pc-windows-msvc\bin\gcc-ld")
            )
            foreach ($dir in $candidates) {
              if (Test-Path (Join-Path $dir "lld-link.exe")) {
                $dir >> $env:GITHUB_PATH
                $env:PATH = "$dir;$env:PATH"
                break
              }
            }
          }
          lld-link --version
      - name: Cargo.lock checksum fingerprint
        id: lock-env
        shell: pwsh
        run: |
          $checksums = (Select-String -Path Cargo.lock -Pattern '^checksum = ' | ForEach-Object { $_.Line }) -join "`n"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $lockHex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($checksums))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          "lock_hash=$lockHex" >> $env:GITHUB_OUTPUT
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
          save-if: false
      - name: Restore sparse crates.io index
        id: index-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry/index
          key: crates-index-win-v1-${{ steps.lock-env.outputs.lock_hash }}
      - name: Restore libmpv cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/libmpv
          key: libmpv-${{ hashFiles('crates/player/build.rs') }}
      # Pure platform-independent `app` unit tests run in the Linux `test` job;
      # run all non-UI crates here (including Windows-only `asio`, `os`, `player`)
      # in parallel with the Windows release build.
      - name: Test Windows crates
        shell: pwsh
        run: |
          $flags = @("--locked")
          if (("${{ steps.rust-cache.outputs.cache-hit }}" -eq "true") -and ("${{ steps.index-cache.outputs.cache-hit }}" -eq "true") -and (Test-Path "$env:CARGO_HOME\registry\index\index.crates.io-*\.cache\re\qw\reqwest")) { $flags += "--offline" }
          cargo test @flags --workspace --exclude app --exclude app-ui --lib --tests --target x86_64-pc-windows-msvc

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Static CRT: runs without the VC++ redistributable.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $line = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ($tag -ne $version) { throw "tag $tag does not match the workspace version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Exclude build paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP" -ErrorAction SilentlyContinue
          } catch {}

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Ensure lld-link is available
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "C:\Program Files\LLVM\bin",
              (Join-Path (rustc --print sysroot) "lib\rustlib\x86_64-pc-windows-msvc\bin\gcc-ld")
            )
            foreach ($dir in $candidates) {
              if (Test-Path (Join-Path $dir "lld-link.exe")) {
                $dir >> $env:GITHUB_PATH
                $env:PATH = "$dir;$env:PATH"
                break
              }
            }
          }
          lld-link --version
      - name: Rust environment fingerprint
        id: rust-env
        shell: pwsh
        run: |
          $checksums = (Select-String -Path Cargo.lock -Pattern '^checksum = ' | ForEach-Object { $_.Line }) -join "`n"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $lockHex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($checksums))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          $parts = @(
            (rustc --version --verbose | Out-String),
            "RUSTFLAGS=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS",
            "LINKER=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER",
            $checksums,
            ((Get-Content Cargo.toml | Select-String -Pattern '^(opt-level|debug|codegen-units|strip|\[profile\.)' | ForEach-Object { $_.Line }) -join "`n")
          ) -join "`n---`n"
          $hex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($parts))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          "hash=$hex" >> $env:GITHUB_OUTPUT
          "lock_hash=$lockHex" >> $env:GITHUB_OUTPUT
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Reuse `main`'s pre-warmed release cache (`cache-release.yml` / `package.yml`).
          shared-key: windows-release
          save-if: false
      - name: Restore sparse crates.io index
        id: index-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry/index
          key: crates-index-win-v1-${{ steps.rust-env.outputs.lock_hash }}
      - name: Restore compiled Slint UI (app-ui release)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/release/build/app-ui
            target/x86_64-pc-windows-msvc/release/build/app-ui
          key: app-ui-win-release-v1-${{ steps.rust-env.outputs.hash }}-${{ hashFiles('crates/app-ui/**', 'crates/app/ui/**', 'crates/app/assets/icon.png') }}
      - name: Normalize app-ui input mtimes
        shell: pwsh
        run: |
          $t = [DateTime]::SpecifyKind([DateTime]'2020-01-01T00:00:00', [DateTimeKind]::Utc)
          Get-ChildItem -File -Recurse crates/app-ui, crates/app/ui | ForEach-Object { $_.LastWriteTimeUtc = $t }
          Get-Item crates/app/assets/icon.png, Cargo.toml | ForEach-Object { $_.LastWriteTimeUtc = $t }
      - name: Restore libmpv cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/libmpv
          key: libmpv-${{ hashFiles('crates/player/build.rs') }}

      - name: Build
        shell: pwsh
        run: |
          $flags = @("--locked")
          if (("${{ steps.rust-cache.outputs.cache-hit }}" -eq "true") -and ("${{ steps.index-cache.outputs.cache-hit }}" -eq "true") -and (Test-Path "$env:CARGO_HOME\registry\index\index.crates.io-*\.cache\re\qw\reqwest")) { $flags += "--offline" }
          cargo build @flags -p app --release --target x86_64-pc-windows-msvc

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 -y --no-progress
          }

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $out = (Resolve-Path "target/x86_64-pc-windows-msvc/release").Path
          if (-not (Test-Path "$out/libmpv-2.dll")) {
            $dll = Get-ChildItem -Path target/libmpv -Filter libmpv-2.dll -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) { throw "libmpv-2.dll not found in $out or target/libmpv" }
            Copy-Item $dll.FullName "$out/libmpv-2.dll"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $dist = (Resolve-Path dist).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DSourceDir=$out" "/DOutputDir=$dist" packaging/windows/032player.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

          $name = "032player-$env:VERSION-windows-x64-portable"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$out/032player.exe" $dir
          Copy-Item "$out/libmpv-2.dll" $dir
          Copy-Item LICENSE "$dir/LICENSE.txt"
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item "crates/app/assets/fonts/OFL-NotoSansSC.txt" "$dir/licenses/"
          Copy-Item "crates/app/assets/fonts/OFL-SourceSerif4.txt" "$dir/licenses/"
          Copy-Item "crates/app/assets/fonts/README.md" "$dir/licenses/FONTS.md"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force $dir
          Get-ChildItem dist -File | ForEach-Object { "$($_.Name) $($_.Length)" }

      # Temporary handoff to `publish` so `test`, `windows-test`, and `windows` run in parallel.
      # `publish` deletes this artifact immediately so permanent Actions storage stays 0.
      - name: Stage release assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [test, windows-test, windows]
    if: always() && needs.windows.outputs.artifact_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Download release assets
        if: needs.test.result == 'success' && needs.windows-test.result == 'success' && needs.windows.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Publish release
        if: needs.test.result == 'success' && needs.windows-test.result == 'success' && needs.windows.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          notes=$(cat <<EOF
          032player ${VERSION}

          - 032player-${VERSION}-windows-x64-setup.exe: 安装包（当前用户安装，不需要管理员权限）
          - 032player-${VERSION}-windows-x64-portable.zip: 免安装版，解压后运行 032player.exe

          设置保存在 %APPDATA%\032player\data（登录凭据在 Windows 凭据管理器），卸载时保留；日志在其中的 logs 文件夹（设置页"打开日志文件夹"）。
          EOF
          )
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "032player ${VERSION}" --notes "${notes}" --verify-tag

      - name: Delete temporary artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ needs.windows.outputs.artifact_id }}" || true

      - name: Verify upstream jobs
        if: needs.test.result != 'success' || needs.windows-test.result != 'success' || needs.windows.result != 'success'
        run: |
          echo "Upstream job did not succeed (test=${{ needs.test.result }}, windows-test=${{ needs.windows-test.result }}, windows=${{ needs.windows.result }})"
          exit 1

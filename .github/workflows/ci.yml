name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - name: Runner image version
        id: image
        run: echo "version=${ImageVersion:-ubuntu-24.04}" >> "$GITHUB_OUTPUT"
      - name: Cache system libraries
        id: apt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/apt-debs
          key: apt-ubuntu-24.04-${{ steps.image.outputs.version }}-libmpv-fontconfig-v1
      - name: System libraries
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && compgen -G "/tmp/apt-debs/*.deb" >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l dpkg --force-unsafe-io -i /tmp/apt-debs/*.deb || {
              sudo find /etc/apt/sources.list.d -type f ! -name '*ubuntu*' -delete
              sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
              sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -f --no-install-recommends \
                -o DPkg::Options::="--force-unsafe-io" \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            }
          else
            mkdir -p /tmp/apt-debs
            sudo find /etc/apt/sources.list.d -type f ! -name '*ubuntu*' -delete
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends \
              -o Dir::Cache::archives=/tmp/apt-debs \
              -o APT::Keep-Downloaded-Packages=true \
              -o DPkg::Options::="--force-unsafe-io" \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              libmpv-dev libfontconfig1-dev pkg-config
            sudo rm -rf /tmp/apt-debs/partial /tmp/apt-debs/lock
            sudo chown -R "$(id -u):$(id -g)" /tmp/apt-debs
          fi
      - name: Rust environment fingerprint
        id: rust-env
        run: |
          {
            rustc --version --verbose
            printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS:-}"
            grep '^checksum = ' Cargo.lock || true
            grep -E '^(opt-level|debug|codegen-units|strip|\[profile\.)' Cargo.toml || true
          } | sha256sum | awk '{print "hash=" substr($1, 1, 16)}' >> "$GITHUB_OUTPUT"
          {
            grep '^checksum = ' Cargo.lock || true
            grep '^checksum = ' tools/ui-snapshot/Cargo.lock || true
          } | sha256sum | awk '{print "lock_hash=" substr($1, 1, 16)}' >> "$GITHUB_OUTPUT"
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          workspaces: |
            .
            tools/ui-snapshot
      # Saved before Swatinem/rust-cache cleans workspace crates & registry index (Post runs in reverse order).
      - name: Cache sparse crates.io index
        id: index-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry/index
          key: crates-index-linux-v1-${{ steps.rust-env.outputs.lock_hash }}
      - name: Cache compiled Slint UI (app-ui)
        id: app-ui-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/debug/build/app-ui
          key: app-ui-linux-debug-v2-${{ steps.rust-env.outputs.hash }}-${{ hashFiles('crates/app-ui/**', 'crates/app/ui/**', 'crates/app/assets/icon.png') }}
      - name: Normalize app-ui input mtimes
        run: |
          find crates/app-ui crates/app/ui -type f -exec touch -d '2020-01-01T00:00:00Z' {} +
          touch -d '2020-01-01T00:00:00Z' crates/app/assets/icon.png
      - run: cargo fmt --all --check
      - name: Clippy
        run: |
          OFFLINE=""
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ] && compgen -G "${CARGO_HOME:-$HOME/.cargo}/registry/index/index.crates.io-*/.cache/re/qw/reqwest" >/dev/null; then OFFLINE="--offline"; fi
          cargo clippy --locked $OFFLINE --workspace --exclude app-ui --all-targets -- -D warnings
      - name: Test
        run: |
          OFFLINE=""
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ] && compgen -G "${CARGO_HOME:-$HOME/.cargo}/registry/index/index.crates.io-*/.cache/re/qw/reqwest" >/dev/null; then OFFLINE="--offline"; fi
          cargo test --locked $OFFLINE --workspace --exclude app-ui --lib --tests --bins
      - name: UI snapshot regression
        run: |
          OFFLINE=""
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ] && compgen -G "${CARGO_HOME:-$HOME/.cargo}/registry/index/index.crates.io-*/.cache/re/qw/reqwest" >/dev/null; then OFFLINE="--offline"; fi
          cargo run --locked $OFFLINE --manifest-path tools/ui-snapshot/Cargo.toml -- /tmp/ui-snapshot

  windows:
    runs-on: windows-latest
    env:
      # Static CRT + LLVM lld-link: matches release.yml and speeds up linking
      # of the large Slint UI and test binaries on Windows.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exclude build paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP" -ErrorAction SilentlyContinue
          } catch {}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - name: Ensure lld-link is available
        shell: pwsh
        run: |
          if (-not (Get-Command lld-link -ErrorAction SilentlyContinue)) {
            $candidates = @(
              "C:\Program Files\LLVM\bin",
              (Join-Path (rustc --print sysroot) "lib\rustlib\x86_64-pc-windows-msvc\bin\gcc-ld")
            )
            foreach ($dir in $candidates) {
              if (Test-Path (Join-Path $dir "lld-link.exe")) {
                $dir >> $env:GITHUB_PATH
                $env:PATH = "$dir;$env:PATH"
                break
              }
            }
          }
          lld-link --version
      - name: Rust environment fingerprint
        id: rust-env
        shell: pwsh
        run: |
          $checksums = (Select-String -Path Cargo.lock -Pattern '^checksum = ' | ForEach-Object { $_.Line }) -join "`n"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $lockHex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($checksums))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          $parts = @(
            (rustc --version --verbose | Out-String),
            "RUSTFLAGS=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS",
            "LINKER=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER",
            $checksums,
            ((Get-Content Cargo.toml | Select-String -Pattern '^(opt-level|debug|codegen-units|strip|\[profile\.)' | ForEach-Object { $_.Line }) -join "`n")
          ) -join "`n---`n"
          $hex = ([System.BitConverter]::ToString($sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($parts))) -replace '-', '').ToLowerInvariant().Substring(0, 16)
          "hash=$hex" >> $env:GITHUB_OUTPUT
          "lock_hash=$lockHex" >> $env:GITHUB_OUTPUT
      - id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
      # Saved before Swatinem/rust-cache cleans workspace crates & registry index (Post runs in reverse order).
      - name: Cache sparse crates.io index
        id: index-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/registry/index
          key: crates-index-win-v1-${{ steps.rust-env.outputs.lock_hash }}
      - name: Cache compiled Slint UI (app-ui)
        id: app-ui-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/debug/build/app-ui
            target/x86_64-pc-windows-msvc/debug/build/app-ui
          key: app-ui-win-debug-v2-${{ steps.rust-env.outputs.hash }}-${{ hashFiles('crates/app-ui/**', 'crates/app/ui/**', 'crates/app/assets/icon.png') }}
      - name: Normalize app-ui input mtimes
        shell: pwsh
        run: |
          $t = [DateTime]::SpecifyKind([DateTime]'2020-01-01T00:00:00', [DateTimeKind]::Utc)
          Get-ChildItem -File -Recurse crates/app-ui, crates/app/ui | ForEach-Object { $_.LastWriteTimeUtc = $t }
          (Get-Item crates/app/assets/icon.png).LastWriteTimeUtc = $t
      - name: Cache libmpv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/libmpv
          key: libmpv-${{ hashFiles('crates/player/build.rs') }}
      - name: Clippy
        shell: pwsh
        run: |
          $flags = @("--locked")
          if (("${{ steps.rust-cache.outputs.cache-hit }}" -eq "true") -and (Test-Path "$env:CARGO_HOME\registry\index\index.crates.io-*\.cache\re\qw\reqwest")) { $flags += "--offline" }
          cargo clippy @flags --workspace --exclude app-ui --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - name: Test
        shell: pwsh
        run: |
          $flags = @("--locked")
          if (("${{ steps.rust-cache.outputs.cache-hit }}" -eq "true") -and (Test-Path "$env:CARGO_HOME\registry\index\index.crates.io-*\.cache\re\qw\reqwest")) { $flags += "--offline" }
          cargo test @flags --workspace --exclude app-ui --lib --tests --bins --target x86_64-pc-windows-msvc

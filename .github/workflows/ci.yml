name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - name: Runner image version
        id: image
        run: echo "version=${ImageVersion:-ubuntu-24.04}" >> "$GITHUB_OUTPUT"
      - name: Cache system libraries
        id: apt-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/apt-debs
          key: apt-ubuntu-24.04-${{ steps.image.outputs.version }}-libmpv-fontconfig-v1
      - name: System libraries
        run: |
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" = "true" ] && compgen -G "/tmp/apt-debs/*.deb" >/dev/null; then
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l dpkg --force-unsafe-io -i /tmp/apt-debs/*.deb || {
              sudo find /etc/apt/sources.list.d -type f ! -name '*ubuntu*' -delete
              sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
              sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y -f --no-install-recommends \
                -o DPkg::Options::="--force-unsafe-io" \
                -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            }
          else
            mkdir -p /tmp/apt-debs
            sudo find /etc/apt/sources.list.d -type f ! -name '*ubuntu*' -delete
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=20
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get install -y --no-install-recommends \
              -o Dir::Cache::archives=/tmp/apt-debs \
              -o APT::Keep-Downloaded-Packages=true \
              -o DPkg::Options::="--force-unsafe-io" \
              -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              libmpv-dev libfontconfig1-dev pkg-config
            sudo rm -rf /tmp/apt-debs/partial /tmp/apt-debs/lock
            sudo chown -R "$(id -u):$(id -g)" /tmp/apt-debs
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          workspaces: |
            .
            tools/ui-snapshot
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: UI snapshot regression
        run: cargo run --manifest-path tools/ui-snapshot/Cargo.toml -- /tmp/ui-snapshot

  windows:
    runs-on: windows-latest
    env:
      # Static CRT: matches release.yml so CI validates the same CRT linkage
      # and warms target/x86_64-pc-windows-msvc/debug for tag releases.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Exclude build paths from Windows Defender
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:TEMP" -ErrorAction SilentlyContinue
          } catch {}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows
      - name: Cache libmpv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/libmpv
          key: libmpv-${{ hashFiles('crates/player/build.rs') }}
      - run: cargo clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo test --workspace --target x86_64-pc-windows-msvc

# Dev tool: renders the app UI with fake data to PNG (software renderer, no
# display, no libmpv). Not part of the main workspace.
[package]
name = "ui-snapshot"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "unstable-fontique-011"] }
slint-interpreter = { version = "1.18", default-features = false, features = ["std", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
spin_on = "0.1"
ttf-parser = "0.25"
